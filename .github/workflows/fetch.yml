# Fetches fixtures, club ratings and match odds once a day and commits the snapshots.
# Approved by Patrick on 13 November 2026 as the one hosted exception (see DECISIONS.md).
# It never contacts UEFA. Keys live in the repository's encrypted secrets:
#   FOOTBALL_DATA_TOKEN  (football-data.org)
#   ODDS_API_KEY         (The Odds API; about 2 credits per run, 500 free per month)
name: Fetch data

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily
  workflow_dispatch:
    inputs:
      probe:
        description: "Also write the probe report (data/probe/report.md)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then uclfa probe; else uclfa fetch || echo "FETCH_PROBLEM=1" >> "$GITHUB_ENV"; fi
          uclfa clubs || true
      - name: Commit snapshots
        run: |
          git config user.name "patrick-fantasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots data/probe
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Fail if a source failed
        if: env.FETCH_PROBLEM == '1'
        run: |
          echo "At least one source failed or was rejected. Good data was kept. See the Fetch step."
          exit 1
