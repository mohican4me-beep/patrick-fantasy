# Modelling choices for the match model (Release 2 Phase B). These are analyst
# assumptions, not game rules and not data. Change them here, never in Python.
# Approved by Patrick with Phase B on 15 November 2026.

match_model:
  # How the bookmaker margin is removed. "power" corrects the favourite-longshot bias:
  # each implied probability 1/odds is raised to the power k that makes them sum to 1.
  margin_method: power

  # Dixon-Coles correction for low scores (0-0, 1-0, 0-1, 1-1). Negative values make
  # 0-0 and 1-1 slightly more likely than independent Poisson goals. -0.05 is Claude's
  # assumption, kept small on purpose, not a value fitted to data. To be checked against
  # results from Matchday 5 onwards; 0 switches the correction off.
  low_score_correction: -0.05

  # Scoreline grid runs from 0 to this many goals per team. The mass beyond it is
  # reported and renormalised. At 20 it is under one in a hundred million even for a
  # team expected to score 4.3 goals (tested in tests/test_match_model.py).
  max_goals: 20

  # Bounds on a team's expected goals during fitting.
  min_rate: 0.05
  max_rate: 6.0

  # The fit must reproduce each market probability within this distance, or the match
  # is flagged. 0.01 is one percentage point (acceptance criterion 3).
  fit_tolerance: 0.01

  # Below these bookmaker counts a match is reported as low confidence.
  min_result_bookmakers: 5
  min_goals_bookmakers: 3

# Player expected points (Release 2 Phase C). Analyst assumptions, not game rules.
player_model:
  # A starter who does not reach 60 minutes is assumed to play this many.
  minutes_if_under_sixty: 45
  # Poisson counts (recoveries, saves, goals conceded) are summed up to this many events.
  max_events: 40
  # Not modelled, and listed as such on every output: player of the match, goals from
  # outside the box, penalties won, conceded, missed or saved, own goals, red cards.

# Baseline player inputs built from public league stats (uclfa pool build). Every value
# here is Claude's assumption, used until predicted lineups and news override a player.
pool_baseline:
  minutes_per_start: 75          # league minutes / this = estimated starts (capped at apps)
  max_start_prob: 0.95
  p60_by_minutes: {80: 0.95, 70: 0.85, 0: 0.70}   # average minutes as a starter -> chance of 60
  sub_prob: 0.5
  minutes_if_sub: 20
  max_goal_share: 0.60
  max_assist_share: 0.50
  # Per 90 minutes. The source's recovery and save columns are members-only and were not
  # taken, so these are position-wide guesses and the weakest inputs in the model.
  recoveries_p90: {GK: 7.0, DEF: 6.0, MID: 5.0, FWD: 2.0}
  saves_p90: 3.0

# Optimizer (Release 2 Phase D). Analyst assumptions, not game rules.
optimizer:
  # Bench players score only through automatic substitutions; this weight stands in for
  # the chance a starter does not play. Claude's assumption.
  bench_weight: 0.1
  # Most transfers searched for a normal (non-chip) matchday.
  max_transfers: 5
  # The Wildcard is judged on this matchday only, which flatters it. It is recommended only
  # when it beats the best normal plan by at least this many expected points.
  wildcard_margin: 8.0
  # `uclfa evaluate`: a move within this many expected points of keeping the squad, over
  # the stretch, is called too close to call.
  verdict_margin: 2.0

# Team news on top of the baseline (data/players/news-*.yaml). Claude's assumptions.
news:
  predicted_start_prob: 0.92     # named in a predicted XI
  doubtful_start_prob: 0.5
  not_in_xi_start_prob: 0.25     # regular starter left out of the predicted XI
  not_in_xi_sub_prob: 0.6

# Team ratings for matches without odds (Release 2 Phase E). Claude's assumptions.
ratings:
  # Weight of one match's market-implied goal rates, relative to one played result.
  # Odds already average many opinions, so they count for more than a single score.
  odds_weight: 3.0
  result_weight: 1.0
  # Pulls every team's attack and defence towards average; stops a team with two lucky
  # results looking like a giant. Larger means more pull.
  shrinkage: 2.0
  # Matches further back count less: weight halves every this many matchdays.
  half_life_matchdays: 4
  # A played result counts at most this many goals per team, so one 9-1 does not make a
  # side look like a giant or a minnow. Chosen by predicting the Matchday 5 odds from
  # Matchday 1-4 results: cap 3 missed the market by 30.8% on average, no cap by 32.4%,
  # treating every team as equal by 43.6% (24 November 2026).
  max_goals_counted: 3
